server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bulk resume uploads (many files in one request).
    client_max_body_size 200m;

    # Auth service: login, session, invitations, user directory.
    location ~ ^/api/v1/(auth|internal|users)(/|$) {
        proxy_pass http://auth:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api goes to the core service (jobs, resumes, shortlists, ...).
    location /api/ {
        proxy_pass http://core:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
