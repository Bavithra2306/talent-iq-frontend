server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bulk resume uploads: up to 150 files or one zip, 350 MB in total (core enforces the same).
    client_max_body_size 350m;
    client_body_timeout 300s;

    # Look up auth/core through Docker's DNS on every request (cached 10 s), not once at
    # start-up: a rebuilt container gets a new IP, and a stale one gives 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_upstream http://auth:8000;
    set $core_upstream http://core:8001;

    # Auth service: login, session, invitations, user directory.
    location ~ ^/api/v1/(auth|internal|users)(/|$) {
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else under /api goes to the core service (jobs, resumes, shortlists, ...).
    location /api/ {
        proxy_pass $core_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
